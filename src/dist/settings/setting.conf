# CUBRID SQL Analyzer settings.
#
# This file is read when no analyzer options are provided on the command line,
# or when it is explicitly selected:
#   ./analyzer.sh -conf settings/setting.conf
#
# Required source/target settings must be uncommented and filled in.
# If required settings are missing, the analyzer prints the missing keys and exits.
#
# -------------------------------------------------------------------------------
# General options
# -------------------------------------------------------------------------------
# You can provide the exact command line. When this is set, structured source and
# target settings below are not used.
# arguments=-so -oj jdbc:oracle:thin:@//host:1521/xe|user|password -sx -xd ./sqlmap
#
# UI mode: console or tui. Default: tui
# ui.mode=console
#
# Optional JDBC driver repository
jdbc.repository.dir=./jdbc
#
# Debug options
# debug.fullquery=false
#
# -------------------------------------------------------------------------------
# Source options (required)
# -------------------------------------------------------------------------------
# Required: source.type
# Choose one: oracle, xml, all
# Sources are independent. Configure either or both; a failing source is skipped
# while the other source continues. If both fail, the analyzer shows the reason.
source.type=all
#
# Oracle source settings
# Required when source.type is oracle or all:
#   source.host, source.port, source.sid, source.username
# Password can be left empty only when the database account allows it.
source.host=localhost
source.port=1521
source.sid=xe
source.username=user
source.password=password
#
# XML source settings
# Required when source.type is xml or all:
#   xml.directory
# xml.charset=UTF-8 is used when omitted.
xml.directory=./sqlmap
xml.charset=UTF-8
#
# -------------------------------------------------------------------------------
# Target options (required)
# -------------------------------------------------------------------------------
# Required: target.type
# Choose parser or jdbc (cubrid is accepted as an alias for jdbc).
target.type=parser
#
# Required when target.type is jdbc or cubrid:
# target.jdbc.url=jdbc:cubrid:localhost:33000:demodb:::
# target.username=dba
# target.password=
